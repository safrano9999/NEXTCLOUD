# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: OpenClaw plugin

on:
  push:
    tags: ["20*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v3
      - name: Check plugin sources
        run: |
          bash scripts/check.sh
          bash -n .github/scripts/runtime/fedora44/scripts/bundle.sh
          bash -n .github/scripts/runtime/debian12/scripts/bundle.sh
      - id: fedora
        name: Resolve Fedora runtime version
        run: echo "version=$(<.github/scripts/runtime/fedora44/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build Fedora runtime
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts/runtime/fedora44
          file: .github/scripts/runtime/fedora44/Containerfile
          target: artifact
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.fedora.outputs.version }}
          outputs: type=local,dest=.runtime-dist/fedora44
      - name: Build Fedora plugin
        run: |
          unzip -t .runtime-dist/fedora44/nextcloudcmd-fedora44-x86_64.zip
          (
            cd .runtime-dist/fedora44
            sha256sum -c nextcloudcmd-fedora44-x86_64.zip.sha256
          )
          rm -rf runtime
          mkdir -p runtime
          unzip -q .runtime-dist/fedora44/nextcloudcmd-fedora44-x86_64.zip -d runtime
          test -x runtime/opt/nextcloudcmd/bin/nextcloudcmd
          ZIP_NAME=nextcloud-fedora64-plugin-latest.zip bash ./openclaw_plugin_zip.sh
          rm -rf runtime .runtime-dist/fedora44
      - name: Build Debian runtime
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts/runtime/debian12
          file: .github/scripts/runtime/debian12/Containerfile
          target: artifact
          outputs: type=local,dest=.runtime-dist/debian12
      - name: Build Debian plugin
        run: |
          unzip -t .runtime-dist/debian12/nextcloudcmd-debian12-x86_64.zip
          (
            cd .runtime-dist/debian12
            sha256sum -c nextcloudcmd-debian12-x86_64.zip.sha256
          )
          rm -rf runtime
          mkdir -p runtime
          unzip -q .runtime-dist/debian12/nextcloudcmd-debian12-x86_64.zip -d runtime
          test -x runtime/opt/nextcloudcmd/bin/nextcloudcmd
          ZIP_NAME=nextcloud-debian64-plugin-latest.zip bash ./openclaw_plugin_zip.sh
          rm -rf runtime .runtime-dist
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" nextcloud-*-plugin-latest.zip* --clobber
          else
            gh release create "$GITHUB_REF_NAME" nextcloud-*-plugin-latest.zip* \
              --title "$GITHUB_REF_NAME" --notes "NEXTCLOUD OpenClaw plugin for Fedora 44 and Debian 12."
          fi
      - name: Publish latest alias
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest nextcloud-*-plugin-latest.zip* --clobber
            gh release edit latest --title latest --notes "Latest NEXTCLOUD OpenClaw plugin."
          else
            gh release create latest nextcloud-*-plugin-latest.zip* --target "$GITHUB_SHA" \
              --title latest --notes "Latest NEXTCLOUD OpenClaw plugin."
          fi
