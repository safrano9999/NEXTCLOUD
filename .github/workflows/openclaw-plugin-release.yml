# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: OpenClaw plugin

on:
  push:
    tags: ["20*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/20') && format('actual-head-{0}', github.repository) || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Start actual-head history
        if: startsWith(github.ref, 'refs/tags/20')
        run: bash .github/scripts/actual-head.sh start
      - name: Purge old Actions artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/purge-github-actions-artifacts.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          keep-state: false
          cleanup: true
      - name: Check plugin sources
        run: |
          bash scripts/check.sh
          bash -n .github/scripts/runtime/fedora44/scripts/bundle.sh
          bash -n .github/scripts/runtime/debian12/scripts/bundle.sh
      - id: runtime
        name: Resolve runtime build configuration
        run: |
          source .github/scripts/runtime/build.config
          [[ "$FEDORA_NEXTCLOUD_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$DEBIAN_NEXTCLOUD_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$DEBIAN_NEXTCLOUD_PACKAGE_VERSION" =~ ^[A-Za-z0-9.+:~_-]+$ ]]
          [[ "$FEDORA_IMAGE" =~ ^[A-Za-z0-9./:_-]+$ ]]
          [[ "$DEBIAN_IMAGE" =~ ^[A-Za-z0-9./:_-]+$ ]]
          {
            echo "fedora_version=$FEDORA_NEXTCLOUD_VERSION"
            echo "debian_version=$DEBIAN_NEXTCLOUD_VERSION"
            echo "debian_package_version=$DEBIAN_NEXTCLOUD_PACKAGE_VERSION"
            echo "fedora_image=$FEDORA_IMAGE"
            echo "debian_image=$DEBIAN_IMAGE"
          } >> "$GITHUB_OUTPUT"
      - name: Build Fedora runtime
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts/runtime/fedora44
          file: .github/scripts/runtime/fedora44/Containerfile
          target: artifact
          pull: true
          no-cache: true
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.runtime.outputs.fedora_version }}
            FEDORA_IMAGE=${{ steps.runtime.outputs.fedora_image }}
          outputs: type=local,dest=.runtime-dist/fedora44
      - name: Build Fedora plugin
        run: |
          unzip -t .runtime-dist/fedora44/nextcloudcmd-fedora44-x86_64.zip
          (
            cd .runtime-dist/fedora44
            sha256sum -c nextcloudcmd-fedora44-x86_64.zip.sha256
          )
          rm -rf runtime
          mkdir -p runtime
          unzip -q .runtime-dist/fedora44/nextcloudcmd-fedora44-x86_64.zip -d runtime
          test -x runtime/opt/nextcloudcmd/bin/nextcloudcmd
          ZIP_NAME=nextcloud-fedora64-plugin-latest.zip \
            bash .github/scripts/openclaw_plugin_zip.sh
          unzip -tqq nextcloud-fedora64-plugin-latest.zip
          unzip -Z1 nextcloud-fedora64-plugin-latest.zip |
            grep -Fx 'runtime/opt/nextcloudcmd/bin/nextcloudcmd'
          test "$(stat -c %s nextcloud-fedora64-plugin-latest.zip)" -gt 1048576
          sha256sum --check --status nextcloud-fedora64-plugin-latest.zip.sha256
          rm -rf runtime .runtime-dist/fedora44
      - name: Build Debian runtime
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts/runtime/debian12
          file: .github/scripts/runtime/debian12/Containerfile
          target: artifact
          pull: true
          no-cache: true
          build-args: |
            NEXTCLOUD_VERSION=${{ steps.runtime.outputs.debian_version }}
            DEBIAN_NEXTCLOUD_PACKAGE_VERSION=${{ steps.runtime.outputs.debian_package_version }}
            DEBIAN_IMAGE=${{ steps.runtime.outputs.debian_image }}
          outputs: type=local,dest=.runtime-dist/debian12
      - name: Build Debian plugin
        run: |
          unzip -t .runtime-dist/debian12/nextcloudcmd-debian12-x86_64.zip
          (
            cd .runtime-dist/debian12
            sha256sum -c nextcloudcmd-debian12-x86_64.zip.sha256
          )
          rm -rf runtime
          mkdir -p runtime
          unzip -q .runtime-dist/debian12/nextcloudcmd-debian12-x86_64.zip -d runtime
          test -x runtime/opt/nextcloudcmd/bin/nextcloudcmd
          ZIP_NAME=nextcloud-debian64-plugin-latest.zip \
            bash .github/scripts/openclaw_plugin_zip.sh
          unzip -tqq nextcloud-debian64-plugin-latest.zip
          unzip -Z1 nextcloud-debian64-plugin-latest.zip |
            grep -Fx 'runtime/opt/nextcloudcmd/bin/nextcloudcmd'
          test "$(stat -c %s nextcloud-debian64-plugin-latest.zip)" -gt 1048576
          sha256sum --check --status nextcloud-debian64-plugin-latest.zip.sha256
          rm -rf runtime .runtime-dist
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" nextcloud-*-plugin-latest.zip* --clobber
          else
            gh release create "$GITHUB_REF_NAME" nextcloud-*-plugin-latest.zip* \
              --title "$GITHUB_REF_NAME" --notes "NEXTCLOUD OpenClaw plugin for Fedora 44 and Debian 12."
          fi
      - name: Publish latest alias
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest nextcloud-*-plugin-latest.zip* --clobber
            gh release edit latest --title latest --notes "Latest NEXTCLOUD OpenClaw plugin."
          else
            gh release create latest nextcloud-*-plugin-latest.zip* --target "$GITHUB_SHA" \
              --title latest --notes "Latest NEXTCLOUD OpenClaw plugin."
          fi
      - name: Purge Actions artifacts after run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/purge-github-actions-artifacts.sh
      - name: Finish actual-head history
        if: startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/actual-head.sh finish
      - name: Publish build log
        id: actual_head_upload
        if: startsWith(github.ref, 'refs/tags/20')
        uses: actions/upload-artifact@v4
        with:
          name: actual-head
          path: actual-head.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Prune previous build logs
        if: startsWith(github.ref, 'refs/tags/20')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/actual-head.sh cleanup "${{ steps.actual_head_upload.outputs.artifact-id }}"
